<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile thingy</title>
   <link rel="stylesheet" href="Animdude.css">
   <link rel="icon" type="x-icon" href="RetardIcon.ico">
</head>
<body>
    <div class="card">
        <div class="card-header"> <a href="https://github.com/Beanos87">
            PROFILE CARD
        </a>
    </div>
        <div class="card-content">
            <div class="photo-section">
                <div class="photo-placeholder">
                    <img src="Retard.webp" class="default">
                    <img src="RetardWithApple.webp" class="hover">
                </div>
            </div>
            <div class="info-section">
                <div class="info-field">
                    <div class="info-label">Name:</div>
                    <div class="info-value">Azka Ukail Bahri</div>
                </div>
                <div class="info-field">
                    <div class="info-label">Age:</div>
                    <div class="info-value">Teen</div>
                </div>
                <div class="info-field">
                    <div class="info-label">Height:</div>
                    <div class="info-value">5'2</div>
                </div>
                <div class="info-field">
                    <div class="info-label">Trait:</div>
                    <div class="info-value">Indifferent</div>
                </div>
                <div class="info-field">
                    <div class="info-label">Favorite:</div>
                    <div class="info-value">Cold Sprite</div>
                </div>
                <div class="info-field">
                    <div class="info-label">Hobby:</div>
                    <div class="info-value">GAMING</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
