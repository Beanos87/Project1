<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile thingy</title>
   <link rel="stylesheet" href="Animdude.css">
   <link rel="icon" type="x-icon" href="RetardIcon.ico">
</head>
<body>
    <div class="card">
        <div class="card-header">
            <a href="https://github.com/Beanos87">
                        PROFILE
                    </a>
                    CARD
                </div>
        <div class="card-content">
            <div class="photo-section">
                <div class="photo-placeholder">
                    <img src="Retard.webp" class="default">
                    <img src="RetardWithApple.webp" class="hover">
                </div>
            </div>
            <div class="info-section">
                <div class="info-field">
                    <div class="info-label">Name:</div>
                    <div class="info-value">
                        <a href="https://cekartinama.com/cari-arti-nama/Azka.html">
                        Azka Ukail Bahri
                    </a>
                </div>
                </div>
                <div class="info-field">
                    <div class="info-label">Age:</div>
                    <div class="info-value">
                        <a href="https://en.wikipedia.org/wiki/Age">
                        Teen
                    </a>
                </div>
                </div>
                <div class="info-field">
                    <div class="info-label">Height:</div>
                    <div class="info-value">
                        <a href="https://en.wikipedia.org/wiki/Human_height">
                        5'2
                    </a>
                </div>
                </div>
                <div class="info-field">
                    <div class="info-label">Trait:</div>
                    <div class="info-value">
                        <a href="https://www.babla.co.id/bahasa-inggris-bahasa-indonesia/indifferent">
                        Indifferent
                    </a>
                </div>
                </div>
                <div class="info-field">
                    <div class="info-label">Favorite:</div>
                    <div class="info-value">
                        <a href="https://en.wikipedia.org/wiki/Sprite_(drink)">
                        Cold Sprite
                    </a>
                </div>
                </div>
                <div class="info-field">
                    <div class="info-label">Hobby:</div>
                    <div class="info-value">
                        <a href="https://www.roblox.com/users/1265716425/profile">
                        Gaming
                    </a>
                </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
